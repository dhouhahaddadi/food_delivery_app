# Nom du service (utilisé par Eureka)
spring.application.name=order-payment-service

# Port du service
server.port=8083

# Config Server optionnel (le service démarre même sans lui)
spring.config.import=optional:configserver:http://localhost:8888

# Base H2 en mémoire pour démarrer sans installation
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Base PostgreSQL (cible) : décommenter et commenter les lignes H2 ci-dessus
# spring.datasource.url=jdbc:postgresql://localhost:5432/order_payment_db
# spring.datasource.username=postgres
# spring.datasource.password=postgres

# Enregistrement dans Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
