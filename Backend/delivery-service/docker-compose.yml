# Base PostgreSQL locale pour le Delivery Service
services:
  delivery-db:
    image: postgres:16
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - delivery-db-data:/var/lib/postgresql/data
volumes:
  delivery-db-data:
