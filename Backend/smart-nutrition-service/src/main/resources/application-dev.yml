spring:
  datasource:
    url: jdbc:h2:mem:nutrition_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: update   
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  rabbitmq:
      listener:
        simple:
          auto-startup: false

server:
  port: 8087

eureka:
  client:
    enabled: false

spring.cloud:
  config:
    enabled: false
  
import: optional:configserver:http://localhost:8888